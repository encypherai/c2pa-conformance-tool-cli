[workspace]
resolver = "2"
members = ["crates/c2pa-validate"]
exclude = ["vendor/c2pa-rs"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.5.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
glob = "0.3.3"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
jsonschema = { version = "0.24", features = ["draft202012"] }
x509-parser = "0.18"
der-parser = "10.0"
pem = "3"
hex = "0.4"
